name: Build Debug APK (video capability fix)

# 只手动触发，避免与仓库自带的 Android Build workflow 在 push 时重复构建两次。
on:
  workflow_dispatch:

concurrency:
  group: video-fix-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  ANDROID_NDK_VERSION: '25.1.8937393'
  ANDROID_CMAKE_VERSION: '3.22.1'
  ANDROID_API_LEVEL: '26'
  RUST_VERSION: '1.88.0'
  MANUAL_DEPS_DIR: manual-deps

jobs:
  build:
    name: Build Debug APK with video capability fix
    # Google 的 Android SDK / NDK / CMake 工具只有 x86_64 Linux 版本，
    # 必须用 GitHub 托管的 x86_64 runner。
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          # 不能 recursive：tools/hotbuild/OperitNightlyRelease 使用 SSH 地址
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize terminal submodule
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- terminal
          git submodule update --init --recursive --depth 1 terminal
          git submodule status -- terminal

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: 'true'

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"

      - name: Restore Android CMake source cache
        uses: actions/cache@v4
        with:
          path: |
            **/.cxx/operit_deps/*-src
          key: android-cmake-sources-${{ runner.os }}-${{ runner.arch }}-arm64-v8a-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}-${{ hashFiles('cmake/**', '**/CMakeLists.txt', '**/*.cmake', '**/build.gradle.kts', 'gradle.properties') }}

      - name: Restore Android dependency cache
        id: cache-manual-deps
        uses: actions/cache@v4
        with:
          path: ${{ env.MANUAL_DEPS_DIR }}
          key: android-full-deps-${{ runner.os }}-${{ hashFiles('ci/script/download_android_dependencies.sh', 'ci/script/prepare_android_dependencies.py') }}

      - name: Restore generated STT asset cache
        uses: actions/cache@v4
        with:
          path: app/build/generated/stt-model-assets
          key: stt-model-assets-${{ runner.os }}-${{ hashFiles('app/config/stt-model-assets.properties') }}

      - name: Download Android dependencies
        if: steps.cache-manual-deps.outputs.cache-hit != 'true'
        run: bash ci/script/download_android_dependencies.sh full "$MANUAL_DEPS_DIR"

      - name: Prepare Android dependencies
        run: |
          python3 ci/script/prepare_android_dependencies.py \
            --profile full \
            --archives "$MANUAL_DEPS_DIR" \
            --repository "$GITHUB_WORKSPACE"

      - name: Restore native ripgrep cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/native_ripgrep/target
          key: native-ripgrep-arm64-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API_LEVEL }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('tools/native_ripgrep/Cargo.toml', 'tools/native_ripgrep/Cargo.lock', 'tools/native_ripgrep/**/*.rs', 'tools/native_ripgrep/build_native_ripgrep.ps1') }}

      - name: Build native ripgrep
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" aarch64-linux-android
          cargo "+$RUST_VERSION" build \
            --manifest-path tools/native_ripgrep/Cargo.toml \
            --release \
            --target aarch64-linux-android \
            --locked
          install -Dm755 \
            tools/native_ripgrep/target/aarch64-linux-android/release/liboperit_ripgrep.so \
            app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so
          test -s app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@10.34.5
          npm ci --no-audit --no-fund
          npm --prefix web-chat ci --no-audit --no-fund
          npm --prefix annual-report ci --no-audit --no-fund

      - name: Build WebChat assets
        run: npm run build:webchat

      - name: Build annual report assets
        run: npm run build:annualreport

      - name: Build bundled ToolPkg packages
        run: |
          npm run build:examples:github
          python3 tools/example_packages/sync_example_packages.py --no-hot-reload

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x ./gradlew

      - name: Unit tests (MediaWireCapability)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --tests '*MediaWireCapabilityTest*' --stacktrace --no-daemon

      - name: Run Gradle build (assembleDebug)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operit-video-fix-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APK exists
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK"
          test -s "$APK"
          echo "APK path: $APK"
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Verify video capability fix is inside the APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          blob = b''
          with zipfile.ZipFile(apk) as z:
              for n in z.namelist():
                  if n.startswith('classes') and n.endswith('.dex'):
                      blob += z.read(n)
          print('dex bytes:', len(blob))
          checks = {
              'MediaWireCapability': b'MediaWireCapability',
              'video placeholder': b'video not sent',
              'deepseek endpoint guard': b'deepseek.com',
              'not-analyzed wording': b'NOT analyzed',
          }
          failed = []
          for label, needle in checks.items():
              ok = needle in blob
              print(('OK   ' if ok else 'FAIL ') + label)
              if not ok:
                  failed.append(label)
          if failed:
              sys.exit('missing in APK: ' + ', '.join(failed))
          print('All APK content checks passed.')
          PY

      # 只有前面 assembleDebug、APK 存在性、内容校验全部通过才会跑到这里
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: operit-debug-video-fix
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14